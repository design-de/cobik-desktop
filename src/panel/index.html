<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Cobi</title>
<style>
  /* หน้านี้เห็นตอน "ของพัง" เท่านั้น — โหลดแผงจากเว็บไม่ได้ (เน็ตหลุด / เว็บล่ม / ยังไม่ deploy)
     จงใจไม่ลอกจานสีของระบบดีไซน์: ถ้าลอก มันจะเพี้ยนเงียบ ๆ ทุกครั้งที่ระบบดีไซน์ขยับ
     แล้วไม่มีใครรู้จนกว่าจะพังจริงแล้วมีคนเห็น (เวอร์ชันก่อนมีสีของตัวเอง 14 ตัว)
     ใช้สีของระบบปฏิบัติการแทน — ตามโหมดสว่าง/มืดของเครื่องเอง ไม่มีอะไรให้ drift */
  :root { color-scheme: light dark; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 28px;
    text-align: center; box-sizing: border-box;
    font: 13px/1.7 -apple-system, "SF Pro Text", "IBM Plex Sans Thai", sans-serif;
    background: Canvas; color: CanvasText;
    border-left: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  p  { margin: 0; max-width: 280px; opacity: .65; }
  code { font-size: 11px; opacity: .45; word-break: break-all; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    background: color-mix(in srgb, CanvasText 8%, Canvas); color: CanvasText;
    border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
  }
  button:hover { border-color: color-mix(in srgb, CanvasText 45%, transparent); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <h1>เปิด Cobi ไม่ได้</h1>
  <p id="why">โหลดแผงผู้ช่วยจากเว็บไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่</p>
  <button id="retry">ลองใหม่</button>
  <code id="target"></code>

<script>
  (async () => {
    const c = window.cobik;
    try { if (c?.getState) document.getElementById('target').textContent = (await c.getState()).target || ''; } catch {}
    document.getElementById('retry').onclick = async () => {
      const b = document.getElementById('retry');
      b.disabled = true; b.textContent = 'กำลังลอง…';
      // ให้เปลือกลองโหลดแผงจากเว็บอีกครั้ง — reload หน้านี้เฉย ๆ จะได้หน้านี้ซ้ำ
      const ok = await c?.retryPanel?.();
      if (!ok) {
        b.disabled = false; b.textContent = 'ลองใหม่';
        document.getElementById('why').textContent = 'ยังเชื่อมต่อไม่ได้ — ลองอีกครั้งในอีกสักครู่';
      }
    };
  })();
</script>
</body>
</html>
